<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casper Wortmann - Portfolio</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #000000;
            font-family: 'Helvetica Neue', sans-serif;
            transition: background-color 0.8s ease, color 0.8s ease;
            overflow-x: hidden;
            /* Prevent horizontal scroll */
        }

        body {
            height: 950vh;
        }

        .fixed-viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            z-index: 1;
            perspective: 1000px;
        }

        /* --- NAME STYLES --- */
        .name-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 1rem;
            z-index: 10;
            pointer-events: none;
        }

        .word {
            display: flex;
        }

        .char-wrap {
            display: inline-block;
            overflow: visible;
            opacity: 0;
            transform: translateY(60px);
            animation: slideUpFade 1s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }

        .char {
            display: inline-block;
            font-size: 8vw;
            font-weight: 800;
            text-transform: uppercase;
            line-height: 1;
            will-change: transform, opacity, filter, color;
            transition: color 0.8s ease;
        }

        .char-wrap:nth-child(1) {
            animation-delay: 0.1s;
        }

        .char-wrap:nth-child(2) {
            animation-delay: 0.15s;
        }

        .char-wrap:nth-child(3) {
            animation-delay: 0.2s;
        }

        .char-wrap:nth-child(4) {
            animation-delay: 0.25s;
        }

        .char-wrap:nth-child(5) {
            animation-delay: 0.3s;
        }

        .char-wrap:nth-child(6) {
            animation-delay: 0.35s;
        }

        .char-wrap:nth-child(7) {
            animation-delay: 0.4s;
        }

        .char-wrap:nth-child(8) {
            animation-delay: 0.45s;
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- PROJECT GALLERY STYLES --- */
        .project-gallery {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        .project-card {
            position: absolute;
            width: 350px;
            height: 500px;
            background-color: #222;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            will-change: transform;
            cursor: pointer;
            /* Change cursor to indicate clickable */
        }

        .project-card img,
        .project-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.9;
            transition: transform 0.6s ease, opacity 0.6s ease;
            pointer-events: none;
            /* Let clicks pass to the card div */
        }

        .project-card:hover img,
        .project-card:hover video {
            transform: scale(1.05);
            opacity: 0.6;
        }

        .card-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
            color: white;
            mix-blend-mode: difference;
            opacity: 0;
            animation: fadeInText 1s 0.8s forwards;
            transition: opacity 0.3s;
        }

        @keyframes fadeInText {
            to {
                opacity: 1;
            }
        }

        /* --- TRANSITION ANIMATION STYLES --- */

        /* The Clone Image that flies to full screen */
        .transition-clone {
            position: fixed;
            z-index: 9999;
            object-fit: cover;
            transform-origin: center center;
            transition: all 0.8s cubic-bezier(0.7, 0, 0.3, 1);
            box-shadow: 0 0 0 rgba(0, 0, 0, 0);
            /* Removes shadow during flight */
        }

        /* Class added to body to hide everything else */
        .is-transitioning .fixed-viewport,
        .is-transitioning .content {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        @media (max-width: 768px) {
            .char {
                font-size: 14vw;
            }

            .project-card {
                width: 70vw;
                height: 90vw;
            }

            .name-container {
                flex-direction: column;
                gap: 0;
            }
        }

        .content {
            position: relative;
            top: 950vh;
            background: #000;
            color: white;
            padding: 4rem 2rem;
            min-height: 50vh;
            z-index: 20;
            border-top: 1px solid #333;
        }

        /* --- LOADER STYLES --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        /* Optional: Simple spinner or text */
        .loader-text {
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }

        /* Stop animations from running immediately */
        .char-wrap {
            animation-play-state: paused;
            /* Pause by default */
        }

        /* When body has class "loaded", play the animations and hide loader */
        body.loaded .char-wrap {
            animation-play-state: running;
        }

        body.loaded #loader {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

    <section class="content">

    <script>
        // --- PRELOADER LOGIC ---
        document.addEventListener("DOMContentLoaded", () => {
            const lazyVideos = document.querySelectorAll("video");

            if ("IntersectionObserver" in window) {
                const videoObserver = new IntersectionObserver((entries, observer) => {
                    entries.forEach((entry) => {
                        // If video is in view
                        if (entry.isIntersecting) {
                            const video = entry.target;
                            // Try to play. If low power mode blocks it, the poster remains.
                            const playPromise = video.play();
                            if (playPromise !== undefined) {
                                playPromise.catch(error => {
                                    console.log("Autoplay prevented (Low Power Mode?):", error);
                                });
                            }
                        }
                        // If video leaves view (pause it to save iPhone memory)
                        else {
                            entry.target.pause();
                        }
                    });
                }, {
                    rootMargin: "0px 0px 200px 0px", // Start loading 200px before it hits the screen
                    threshold: 0.1
                });

                lazyVideos.forEach((video) => {
                    videoObserver.observe(video);
                });
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            const loader = document.getElementById('loader');
            // Select all media inside project cards
            const allMedia = document.querySelectorAll('.project-card img, .project-card video');
            // Only take the first 5
            const mediaToLoad = Array.from(allMedia).slice(0, 15);

            let promises = [];

            mediaToLoad.forEach(media => {
                promises.push(new Promise((resolve) => {
                    // CASE 1: IMAGE
                    if (media.tagName === 'IMG') {
                        if (media.complete) {
                            resolve(); // Already loaded (cache)
                        } else {
                            media.onload = resolve;
                            media.onerror = resolve; // Resolve even on error so site doesn't hang
                        }
                    }
                    // CASE 2: VIDEO
                    else if (media.tagName === 'VIDEO') {
                        // readyState 3 means we have enough data to play current and future frames
                        if (media.readyState >= 3) {
                            resolve();
                        } else {
                            media.oncanplay = resolve;
                            media.onerror = resolve;
                        }
                    }
                }));
            });

            // Safety fallback: If loading takes longer than 4 seconds, force show the site.
            const timeout = new Promise((resolve) => {
                setTimeout(resolve, 4000);
            });

            // Wait for either all 5 images/videos OR the timeout
            Promise.race([Promise.all(promises), timeout]).then(() => {
                document.body.classList.add('loaded');
            });
        });

        // Main
        const chars = document.querySelectorAll('.char');
        const projects = document.querySelectorAll('.project-card');
        const body = document.body;
        let isTransitioning = false; // Flag to stop scroll math when clicking

        // --- SCROLL LOGIC ---
        window.addEventListener('scroll', () => {
            if (isTransitioning) return; // Stop updates if we are leaving

            const scrollY = window.scrollY;
            const screenH = window.innerHeight;

            // 1. Color Flip
            if (scrollY > screenH * 0.2) {
                body.style.backgroundColor = '#000000';
                body.style.color = '#ffffff';
                chars.forEach(char => char.style.color = '#ffffff');
            } else {
                body.style.backgroundColor = '#ffffff';
                body.style.color = '#000000';
                chars.forEach(char => char.style.color = '#000000');
            }

            // 2. Name Explode
            chars.forEach(char => {
                const speed = parseFloat(char.getAttribute('data-speed'));
                const yPos = scrollY * speed * 0.35;
                const dist = Math.abs(yPos);
                const opacity = 1 - Math.min(dist / 500, 1);
                const blur = Math.min(dist / 50, 10);
                char.style.transform = `translate3d(0, ${yPos}px, 0)`;
                char.style.opacity = opacity;
                char.style.filter = `blur(${blur}px)`;
            });

            // 3. Projects Fly
            projects.forEach(card => {
                const speed = parseFloat(card.getAttribute('data-speed'));
                const yMove = -scrollY * speed * 0.7;
                card.style.transform = `translate3d(0, ${yMove}px, 0)`;
            });
        });


        // --- CLICK TRANSITION LOGIC ---
        // --- UPDATED CLICK TRANSITION LOGIC ---
        projects.forEach(card => {
            card.addEventListener('click', (e) => {
                e.preventDefault();
                isTransitioning = true;

                const href = card.getAttribute('data-href');

                // 1. Detect if it's an Image or Video
                let media = card.querySelector('img');
                let isVideo = false;

                // If no image found, look for video
                if (!media) {
                    media = card.querySelector('video');
                    isVideo = true;
                }

                const rect = card.getBoundingClientRect();

                // 2. Create the appropriate Clone (Image or Video)
                let clone;
                if (isVideo) {
                    clone = document.createElement('video');
                    // Get the source URL from the <source> tag or the src attribute
                    const source = media.querySelector('source');
                    clone.src = source ? source.src : media.src;
                    clone.muted = true;
                    clone.loop = true;
                    clone.autoplay = true;
                    clone.playsInline = true;
                } else {
                    clone = document.createElement('img');
                    clone.src = media.src;
                }

                clone.classList.add('transition-clone');

                // Set initial position
                clone.style.top = rect.top + 'px';
                clone.style.left = rect.left + 'px';
                clone.style.width = rect.width + 'px';
                clone.style.height = rect.height + 'px';

                document.body.appendChild(clone);
                document.body.classList.add('is-transitioning');

                // Force Reflow
                void clone.offsetWidth;

                // Animate
                clone.style.top = '0';
                clone.style.left = '0';
                clone.style.width = '100vw';
                clone.style.height = '100vh';

                setTimeout(() => {
                    window.location.href = href;
                }, 800);
            });
        });

        window.addEventListener('pageshow', (event) => {
            // Check if we have any left-over transition clones
            const existingClones = document.querySelectorAll('.transition-clone');

            if (existingClones.length > 0) {
                // Remove the clone image
                existingClones.forEach(clone => clone.remove());

                // Remove the class that hides the content
                document.body.classList.remove('is-transitioning');

                // Re-enable scroll math
                isTransitioning = false;
            }
        });
    </script>
